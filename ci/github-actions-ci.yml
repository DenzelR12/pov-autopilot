name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" python-hcl2
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
      - run: pip install -e .
      - name: Generate fresh packs
        run: |
          pdsa sample --out alerts.csv
          pdsa pov alerts.csv --customer "CI Check" --out pack
          pdsa migrate --bundle examples/opsgenie_export.json --out mig
      - name: Validate generated Terraform
        run: |
          for d in pack/terraform mig/terraform examples/acme_pov/terraform examples/acme_migration/terraform; do
            echo "::group::$d"
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
            echo "::endgroup::"
          done
